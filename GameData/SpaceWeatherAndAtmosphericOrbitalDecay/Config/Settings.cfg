ORBITAL_DECAY
{
    // --- SOLAR STORM DECAY ---
    // For Kerbalism players: Solar Storm Decay is always active.
    // For non-Kerbalism players: This feature is unavailable.
    stormDecayRate = 1.5e-7 // Base decay rate during storm (~1.3% per day)
    stormDistanceScaling = true // Intensity scales with distance to sun

    // --- NATURAL ATMOSPHERIC DECAY ---
    // For Kerbalism players: Natural Decay is optional.
    // For non-Kerbalism players: Only Natural Decay is available.
    naturalDecayEnabled = true
    naturalDecayMultiplier = 1.0 // Global multiplier for drag force. Default 1.0 is recommended.
    
    // Exosphere Cutoff: Altitude limit for decay calculations (Multiplier of Atmosphere Depth).
    // This setting determines the maximum altitude where decay is applied.
    // Default: 10.0 (e.g. 700km on Kerbin).
    naturalDecayAltitudeCutoff = 10.0

    // Exosphere Density Fit:
    // Below atmosphereDepth, SWAOD reads the body's native pressure/temperature curve directly.
    // Above atmosphereDepth, stock KSP density is zero, so SWAOD fits ln(density) over the upper
    // atmosphere and extrapolates with an exponential scale height.
    exosphereFitStart = 0.80 // Start of the fit window, as a fraction of atmosphereDepth.
    exosphereFitEnd = 0.90 // End of the fit window, as a fraction of atmosphereDepth.
    exosphereScaleHeightMin = 0.03 // Minimum fitted scale height, as a fraction of atmosphereDepth.
    exosphereScaleHeightMax = 0.30 // Maximum fitted scale height, as a fraction of atmosphereDepth.
    exosphereFitSamples = 8 // Samples used for the ln(density) fit.

    // Orbit-averaged drag samples. Lower values are faster; higher values better capture eccentric orbits.
    orbitAverageSamples = 24

    // --- NOTIFICATIONS ---
    warningEnabled = true
    warningThreshold = 0.2 // Warn when Periapsis < 120% of atmosphere height (1.0 + Threshold)
    reentryDestroySeconds = 60.0 // Unloaded vessels are destroyed after this many seconds in atmosphere
}
