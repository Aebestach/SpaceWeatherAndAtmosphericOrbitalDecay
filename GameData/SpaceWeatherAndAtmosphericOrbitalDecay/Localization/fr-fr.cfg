        #LOC_SWAOD_ParamTitle = Général
        #LOC_SWAOD_ParamSection = Météo Spatiale et Déclin Orbital
        #LOC_SWAOD_ParamGameplayTitle = Paramètres de déclin
        #LOC_SWAOD_ParamStormDecayRate = Taux de déclin solaire
        #LOC_SWAOD_ParamStormDecayRate_tip = Taux de base pendant une tempête solaire Kerbalism (~1,3 % par jour par défaut). Nécessite Kerbalism ; sans lui, ce réglage n'a aucun effet.
        #LOC_SWAOD_ParamStormDistanceScaling = Échelle selon la distance au Soleil
        #LOC_SWAOD_ParamStormDistanceScaling_tip = Si activé, l'intensité du déclin solaire varie avec la distance au Soleil.
        #LOC_SWAOD_ParamNaturalDecayEnabled = Déclin atmosphérique naturel
        #LOC_SWAOD_ParamNaturalDecayEnabled_tip = Active la traînée atmosphérique continue. Sans Kerbalism, c'est le seul mode ; avec Kerbalism, optionnel en plus du déclin solaire.
        #LOC_SWAOD_ParamNaturalDecayMultiplier = Multiplicateur de déclin naturel
        #LOC_SWAOD_ParamNaturalDecayMultiplier_tip = Multiplicateur global de la traînée naturelle. 1,0 est recommandé.
        #LOC_SWAOD_ParamNaturalDecayAltitudeCutoff = Plafond d'altitude du déclin naturel
        #LOC_SWAOD_ParamNaturalDecayAltitudeCutoff_tip = Altitude maximale pour les calculs, en multiple de la profondeur atmosphérique (ex. 10,0 ≈ 700 km sur Kerbin).
        #LOC_SWAOD_ParamExosphereFitStart = Début de l'ajustement exosphère
        #LOC_SWAOD_ParamExosphereFitStart_tip = Début de la fenêtre d'ajustement de densité en haute atmosphère, en fraction de la profondeur atmosphérique.
        #LOC_SWAOD_ParamExosphereFitEnd = Fin de l'ajustement exosphère
        #LOC_SWAOD_ParamExosphereFitEnd_tip = Fin de la fenêtre d'ajustement. Au-dessus de l'atmosphère, la densité KSP est nulle et SWAOD extrapole avec une échelle de hauteur ajustée.
        #LOC_SWAOD_ParamExosphereScaleHeightMin = Échelle de hauteur min
        #LOC_SWAOD_ParamExosphereScaleHeightMin_tip = Échelle de hauteur minimale pour l'extrapolation exosphérique, en fraction de la profondeur atmosphérique.
        #LOC_SWAOD_ParamExosphereScaleHeightMax = Échelle de hauteur max
        #LOC_SWAOD_ParamExosphereScaleHeightMax_tip = Échelle de hauteur maximale pour l'extrapolation exosphérique, en fraction de la profondeur atmosphérique.
        #LOC_SWAOD_ParamExosphereFitSamples = Échantillons d'ajustement exosphère
        #LOC_SWAOD_ParamExosphereFitSamples_tip = Nombre d'échantillons pour l'ajustement ln(densité) en haute atmosphère.
        #LOC_SWAOD_ParamOrbitAverageSamples = Échantillons de moyenne orbitale
        #LOC_SWAOD_ParamOrbitAverageSamples_tip = Échantillons pour les estimations de traînée moyennées sur l'orbite. Plus bas = plus rapide ; plus haut = mieux pour les orbites excentriques.
        #LOC_SWAOD_ParamWarningEnabled = Avertissements orbite basse
        #LOC_SWAOD_ParamWarningEnabled_tip = Affiche des avertissements quand le périapside descend sous le seuil d'orbite basse.
        #LOC_SWAOD_ParamWarningThreshold = Seuil d'avertissement orbite basse
        #LOC_SWAOD_ParamWarningThreshold_tip = Avertir quand le périapside est sous hauteur atmosphérique × (1,0 + seuil). 0,2 = 120 % de la hauteur atmosphérique.
        #LOC_SWAOD_ParamReentryDestroySeconds = Compte à rebours destruction rentrée (s)
        #LOC_SWAOD_ParamReentryDestroySeconds_tip = Les vaisseaux non chargés sont détruits après ce nombre de secondes dans l'atmosphère.
        #LOC_SWAOD_ParamUiScalePercent = Échelle UI (%)
        #LOC_SWAOD_ParamUiScalePercent_tip = Multiplicateur supplémentaire pour les fenêtres SWAOD par rapport à l'échelle UI de KSP. 100 correspond à KSP ; 50 est la moitié ; 150 est 1,5x.
        #LOC_SWAOD_ParamHotkeyKey = Raccourci clavier
        #LOC_SWAOD_ParamHotkeyKey_tip = Touche principale pour ouvrir la fenêtre SWAOD. Choisissez None pour désactiver le raccourci.
        #LOC_SWAOD_ParamHotkeyAlt = Raccourci nécessite Alt
        #LOC_SWAOD_ParamHotkeyAlt_tip = Maintenez Alt en appuyant sur la touche principale.
        #LOC_SWAOD_ParamHotkeyCtrl = Raccourci nécessite Ctrl
        #LOC_SWAOD_ParamHotkeyCtrl_tip = Maintenez Ctrl en appuyant sur la touche principale.
        #LOC_SWAOD_ParamHotkeyShift = Raccourci nécessite Shift
        #LOC_SWAOD_ParamHotkeyShift_tip = Maintenez Shift en appuyant sur la touche principale.
