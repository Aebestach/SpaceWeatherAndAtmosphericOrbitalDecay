        #LOC_SWAOD_ParamTitle = 常规设置
        #LOC_SWAOD_ParamSection = 空间天气与大气轨道衰减
        #LOC_SWAOD_ParamGameplayTitle = 衰减设置
        #LOC_SWAOD_ParamStormDecayRate = 太阳风暴衰减率
        #LOC_SWAOD_ParamStormDecayRate_tip = Kerbalism 太阳风暴期间的基础衰减率（默认值约每天 1.3%）。需要 Kerbalism；未安装时此项无效。
        #LOC_SWAOD_ParamStormDistanceScaling = 风暴距离缩放
        #LOC_SWAOD_ParamStormDistanceScaling_tip = 启用后，风暴衰减强度随载具与太阳的距离变化。
        #LOC_SWAOD_ParamNaturalDecayEnabled = 自然大气衰减
        #LOC_SWAOD_ParamNaturalDecayEnabled_tip = 启用天体高层大气的持续阻力衰减。无 Kerbalism 时这是唯一的衰减模式；有 Kerbalism 时可与风暴衰减并存。
        #LOC_SWAOD_ParamNaturalDecayMultiplier = 自然衰减倍率
        #LOC_SWAOD_ParamNaturalDecayMultiplier_tip = 自然阻力力的全局倍率。推荐使用默认值 1.0。
        #LOC_SWAOD_ParamNaturalDecayAltitudeCutoff = 自然衰减高度上限
        #LOC_SWAOD_ParamNaturalDecayAltitudeCutoff_tip = 衰减计算的最大高度，以大气层深度为倍数（例如 10.0 在 Kerbin 上约 700 km）。
        #LOC_SWAOD_ParamExosphereFitStart = 外逸层拟合起点
        #LOC_SWAOD_ParamExosphereFitStart_tip = 上层大气密度拟合窗口的起点，以大气层深度为比例。低于大气层深度时 SWAOD 直接使用天体原生气压曲线。
        #LOC_SWAOD_ParamExosphereFitEnd = 外逸层拟合终点
        #LOC_SWAOD_ParamExosphereFitEnd_tip = 上层大气密度拟合窗口的终点，以大气层深度为比例。高于大气层深度时原版密度为零，SWAOD 用拟合的标高进行外推。
        #LOC_SWAOD_ParamExosphereScaleHeightMin = 外逸层标高下限
        #LOC_SWAOD_ParamExosphereScaleHeightMin_tip = 外逸层外推所用的最小拟合标高，以大气层深度为比例。
        #LOC_SWAOD_ParamExosphereScaleHeightMax = 外逸层标高上限
        #LOC_SWAOD_ParamExosphereScaleHeightMax_tip = 外逸层外推所用的最大拟合标高，以大气层深度为比例。
        #LOC_SWAOD_ParamExosphereFitSamples = 外逸层拟合采样数
        #LOC_SWAOD_ParamExosphereFitSamples_tip = 上层大气 ln(密度) 拟合所用的采样点数。
        #LOC_SWAOD_ParamOrbitAverageSamples = 轨道平均采样数
        #LOC_SWAOD_ParamOrbitAverageSamples_tip = 轨道平均阻力估算的采样数。较低值更快，较高值对偏心率大的轨道更准确。
        #LOC_SWAOD_ParamWarningEnabled = 低轨警告
        #LOC_SWAOD_ParamWarningEnabled_tip = 当载具近地点低于低轨阈值时显示警告。
        #LOC_SWAOD_ParamWarningThreshold = 低轨警告阈值
        #LOC_SWAOD_ParamWarningThreshold_tip = 近地点低于 大气层高度 × (1.0 + 阈值) 时警告。默认 0.2 表示大气层高度的 120%。
        #LOC_SWAOD_ParamReentryDestroySeconds = 再入销毁倒计时（秒）
        #LOC_SWAOD_ParamReentryDestroySeconds_tip = 未加载载具进入大气层后，经过此秒数将被销毁。
        #LOC_SWAOD_ParamUiScaleAuto = 按分辨率自动 UI 缩放
        #LOC_SWAOD_ParamUiScaleAuto_tip = 开启后按当前屏幕分辨率自动设置 UI 缩放：4K 为 75%，2K 为 85%，1080p 为 100%。关闭后可手动调整下方滑块。
        #LOC_SWAOD_ParamUiScalePercent = UI 缩放 (%)
        #LOC_SWAOD_ParamUiScalePercent_tip = SWAOD 窗口相对 KSP UI 缩放的额外倍率。100 表示与 KSP 设置一致；50 为一半，150 为 1.5x。自动模式下此项只读。
        #LOC_SWAOD_ParamHotkeyKey = 窗口热键
        #LOC_SWAOD_ParamHotkeyKey_tip = 打开 SWAOD 窗口的主键。选择 None 可禁用热键。
        #LOC_SWAOD_ParamHotkeyAlt = 热键需要 Alt
        #LOC_SWAOD_ParamHotkeyAlt_tip = 按住 Alt 再按主键。
        #LOC_SWAOD_ParamHotkeyCtrl = 热键需要 Ctrl
        #LOC_SWAOD_ParamHotkeyCtrl_tip = 按住 Ctrl 再按主键。
        #LOC_SWAOD_ParamHotkeyShift = 热键需要 Shift
        #LOC_SWAOD_ParamHotkeyShift_tip = 按住 Shift 再按主键。
        #LOC_SWAOD_ParamDebugMode = 启用调试模式
        #LOC_SWAOD_ParamDebugMode_tip = 在 SWAOD 窗口中显示调试配置面板、日志导出、强制风暴及载具级调试选项。
    }
