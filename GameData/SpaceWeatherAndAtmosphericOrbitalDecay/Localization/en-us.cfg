        #LOC_SWAOD_ParamTitle = General
        #LOC_SWAOD_ParamSection = Space Weather & Atmospheric Orbital Decay
        #LOC_SWAOD_ParamGameplayTitle = Decay settings
        #LOC_SWAOD_ParamStormDecayRate = Storm decay rate
        #LOC_SWAOD_ParamStormDecayRate_tip = Base decay rate during a Kerbalism solar storm (~1.3% per day at default). Requires Kerbalism; without it this setting has no effect.
        #LOC_SWAOD_ParamStormDistanceScaling = Storm distance scaling
        #LOC_SWAOD_ParamStormDistanceScaling_tip = When enabled, storm decay intensity scales with the vessel's distance from the Sun.
        #LOC_SWAOD_ParamNaturalDecayEnabled = Natural atmospheric decay
        #LOC_SWAOD_ParamNaturalDecayEnabled_tip = Enables continuous atmospheric drag above a body's atmosphere. Without Kerbalism this is the only decay mode; with Kerbalism it is optional alongside storm decay.
        #LOC_SWAOD_ParamNaturalDecayMultiplier = Natural decay multiplier
        #LOC_SWAOD_ParamNaturalDecayMultiplier_tip = Global multiplier for natural drag force. Default 1.0 is recommended.
        #LOC_SWAOD_ParamNaturalDecayAltitudeCutoff = Natural decay altitude cutoff
        #LOC_SWAOD_ParamNaturalDecayAltitudeCutoff_tip = Maximum altitude for decay calculations, as a multiple of atmosphere depth (e.g. 10.0 ≈ 700 km on Kerbin).
        #LOC_SWAOD_ParamExosphereFitStart = Exosphere fit start
        #LOC_SWAOD_ParamExosphereFitStart_tip = Start of the upper-atmosphere density fit window, as a fraction of atmosphere depth. Below atmosphere depth SWAOD uses the body's native pressure curve.
        #LOC_SWAOD_ParamExosphereFitEnd = Exosphere fit end
        #LOC_SWAOD_ParamExosphereFitEnd_tip = End of the upper-atmosphere density fit window, as a fraction of atmosphere depth. Above atmosphere depth stock KSP density is zero, so SWAOD extrapolates with a fitted scale height.
        #LOC_SWAOD_ParamExosphereScaleHeightMin = Exosphere scale height min
        #LOC_SWAOD_ParamExosphereScaleHeightMin_tip = Minimum fitted scale height used for exosphere extrapolation, as a fraction of atmosphere depth.
        #LOC_SWAOD_ParamExosphereScaleHeightMax = Exosphere scale height max
        #LOC_SWAOD_ParamExosphereScaleHeightMax_tip = Maximum fitted scale height used for exosphere extrapolation, as a fraction of atmosphere depth.
        #LOC_SWAOD_ParamExosphereFitSamples = Exosphere fit samples
        #LOC_SWAOD_ParamExosphereFitSamples_tip = Number of samples used for the ln(density) fit in the upper atmosphere.
        #LOC_SWAOD_ParamOrbitAverageSamples = Orbit average samples
        #LOC_SWAOD_ParamOrbitAverageSamples_tip = Samples used for orbit-averaged drag estimates. Lower values are faster; higher values better capture eccentric orbits.
        #LOC_SWAOD_ParamWarningEnabled = Low-orbit warnings
        #LOC_SWAOD_ParamWarningEnabled_tip = Show warnings when a vessel's periapsis drops below the low-orbit threshold.
        #LOC_SWAOD_ParamWarningThreshold = Low-orbit warning threshold
        #LOC_SWAOD_ParamWarningThreshold_tip = Warn when periapsis is below atmosphere height × (1.0 + threshold). Default 0.2 means 120% of atmosphere height.
        #LOC_SWAOD_ParamReentryDestroySeconds = Re-entry destroy countdown (s)
        #LOC_SWAOD_ParamReentryDestroySeconds_tip = Unloaded vessels are destroyed after this many seconds inside the atmosphere.
        #LOC_SWAOD_ParamUiScaleAuto = Auto UI scale by resolution
        #LOC_SWAOD_ParamUiScaleAuto_tip = When enabled, UI scale follows screen height: 75% at 4K, 85% at 1440p, 100% at 1080p. Disable to use the slider below manually.
        #LOC_SWAOD_ParamUiScalePercent = UI scale (%)
        #LOC_SWAOD_ParamUiScalePercent_tip = Extra multiplier for SWAOD windows on top of KSP UI scale. 100 matches KSP; 50 is half size; 150 is 1.5x. Read-only while auto mode is enabled.
        #LOC_SWAOD_ParamHotkeyKey = Window hotkey
        #LOC_SWAOD_ParamHotkeyKey_tip = Primary key used to open the SWAOD window. Choose None to disable the hotkey.
        #LOC_SWAOD_ParamHotkeyAlt = Hotkey requires Alt
